kind = "mobile"
previewPath = "/mobile/"
title = "Sunday Drive Mobile"
description = "A native iOS and Android companion for Sunday Drive, helping Southern California drivers plan scenic outings with a simple location and duration form and an illustrative map preview."
version = "1.0.0"
id = "artifacts/sunday-drive-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 20045

[services.development]
run = "pnpm --filter @workspace/sunday-drive-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sunday-drive-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/sunday-drive-mobile", "run", "serve" ]

[services.env]
PORT = "20045"
BASE_PATH = "/mobile/"
