kind = "web"
previewPath = "/"
title = "Sunday Drive"
description = "A polished Southern California scenic-drive discovery landing page with a map-inspired preview and simple drive-planning controls."
version = "1.0.0"
id = "artifacts/sunday-drive"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18240

[services.development]
run = "pnpm --filter @workspace/sunday-drive run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sunday-drive", "run", "build" ]
serve = "static"
publicDir = "artifacts/sunday-drive/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18240"
BASE_PATH = "/"
